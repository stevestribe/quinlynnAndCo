name: Auto-Deploy Staging on Content Change

# Triggers when Markdown content files are pushed to main.
# Rebuilds HTML from content and mirrors to staging.
# Separate from deploy-staging.yml so flow publish still works.

on:
  push:
    branches: [main]
    paths:
      - "site/content/pages/*.md"

permissions:
  contents: read

concurrency:
  group: quinlynnandco-staging
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build HTML and deploy to staging
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build dependencies
        run: pip install markdown

      - name: Build HTML from content
        run: python3 scripts/build-site.py

      - name: Validate staging deployment inputs
        shell: bash
        env:
          IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          IONOS_SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          IONOS_SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          IONOS_SFTP_PORT: ${{ secrets.IONOS_SFTP_PORT }}
          IONOS_STAGING_REMOTE_PATH: ${{ secrets.IONOS_STAGING_REMOTE_PATH }}
          IONOS_PRODUCTION_REMOTE_PATH: ${{ secrets.IONOS_PRODUCTION_REMOTE_PATH }}
        run: |
          set -euo pipefail
          for name in \
            IONOS_SFTP_HOST \
            IONOS_SFTP_USER \
            IONOS_SFTP_PASSWORD \
            IONOS_SFTP_PORT \
            IONOS_STAGING_REMOTE_PATH \
            IONOS_PRODUCTION_REMOTE_PATH
          do
            if [[ -z "${!name}" ]]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done
          if [[ "$IONOS_STAGING_REMOTE_PATH" == "$IONOS_PRODUCTION_REMOTE_PATH" ]]; then
            echo "Staging and production remote paths must be different." >&2
            exit 1
          fi
          test -d site
          test -f site/index.html

      - name: Install SFTP mirroring tool
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lftp

      - name: Mirror site to staging
        shell: bash
        env:
          IONOS_SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          IONOS_SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          IONOS_SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          IONOS_SFTP_PORT: ${{ secrets.IONOS_SFTP_PORT }}
          IONOS_STAGING_REMOTE_PATH: ${{ secrets.IONOS_STAGING_REMOTE_PATH }}
        run: |
          set -euo pipefail
          lftp <<LFTP_SCRIPT
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 20
          set sftp:auto-confirm yes
          open -u "$IONOS_SFTP_USER","$IONOS_SFTP_PASSWORD" "sftp://$IONOS_SFTP_HOST:$IONOS_SFTP_PORT"
          mirror --reverse --delete --verbose --exclude-glob .DS_Store site/ "$IONOS_STAGING_REMOTE_PATH"
          bye
          LFTP_SCRIPT
