<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Staging Editor — Quinlynn &amp; Co.</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;1,400&family=Manrope:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="admin.css?v=4" />
</head>
<body>

<header class="adm-bar">
  <div class="adm-brand">
    <span class="adm-brand-name">Quinlynn &amp; Co.</span>
    <span class="adm-badge">Staging Editor</span>
  </div>

  <div class="adm-dirty-msg" id="adm-dirty-msg" hidden>
    <span class="adm-dirty-dot" aria-hidden="true"></span>
    <span id="adm-dirty-label">Unsaved changes</span>
  </div>

  <div class="adm-actions">
    <span class="adm-status" id="adm-status" aria-live="polite"></span>
    <button class="adm-btn adm-btn-toggle is-active" id="adm-pencils-toggle" title="Toggle edit pencils" aria-pressed="true">
      <svg width="13" height="13" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 4l6 6L10 28H4v-6L22 4z"/></svg>
      Pencils
    </button>
    <a class="adm-btn" id="adm-view-live" href="https://staging.quinlynnandco.com/" target="_blank" rel="noopener">View live</a>
    <button class="adm-btn adm-btn-primary" id="adm-publish" disabled>Publish to staging</button>
  </div>
</header>

<div class="adm-workspace">
  <iframe id="adm-frame" title="Site preview"></iframe>
  <div class="adm-frame-overlay" id="adm-frame-overlay" hidden></div>
</div>

<!-- Floating field editor popup -->
<div class="adm-popup" id="adm-popup" role="dialog" aria-labelledby="adm-popup-label">
  <div class="adm-popup-head">
    <span class="adm-popup-label" id="adm-popup-label"></span>
    <button class="adm-popup-x" id="adm-popup-cancel" aria-label="Cancel edit">
      <svg width="11" height="11" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 8l16 16M24 8L8 24"/></svg>
    </button>
  </div>
  <div class="adm-popup-body" id="adm-popup-body"></div>
  <div class="adm-popup-foot">
    <span class="adm-popup-hint" id="adm-popup-hint"></span>
    <button class="adm-btn adm-btn-sm adm-btn-primary" id="adm-popup-confirm">Done</button>
  </div>
</div>

<!-- GitHub token dialog -->
<dialog class="adm-dialog" id="token-dialog" aria-labelledby="token-dialog-title">
  <form id="token-form" method="dialog">
    <h2 class="adm-dialog-title" id="token-dialog-title">Connect to GitHub</h2>
    <p class="adm-dialog-body">
      Enter your GitHub access token to load and publish content.
      Stored in this browser session only — never sent anywhere else.
    </p>
    <label class="adm-field-label">
      GitHub Token
      <input id="token-input" class="adm-input" type="password"
        autocomplete="off" spellcheck="false" placeholder="github_pat_…" />
    </label>
    <p class="adm-dialog-hint">
      Fine-grained token with <em>Contents: Read and write</em> and
      <em>Actions: Read and write</em> on this repository.
    </p>
    <div class="adm-dialog-error" id="token-error" hidden></div>
    <div class="adm-dialog-actions">
      <button type="button" id="token-cancel-btn" class="adm-btn">Cancel</button>
      <button type="submit" class="adm-btn adm-btn-primary">Connect</button>
    </div>
  </form>
</dialog>

<script src="admin-fields.js?v=4" defer></script>
<script src="admin.js?v=4" defer></script>
</body>
</html>
