<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quinlynn &amp; Co. — Coming Soon</title>
<meta name="description" content="Quinlynn & Co. — a mother-daughter studio in McKinney, Texas making heirloom-quality fabric goods. New site coming soon. Recent small-batch drops are listed on Etsy." />
<meta name="robots" content="noindex" />

<!-- Open Graph -->
<meta property="og:title" content="Quinlynn & Co. — Coming Soon" />
<meta property="og:description" content="Heirloom-quality fabric goods, handmade to be used and kept. Our new home is on its way — find recent drops on Etsy." />
<meta property="og:type" content="website" />
<meta property="og:image" content="https://quinlynnandco.com/assets/og-image.png" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta property="og:image:alt" content="Quinlynn & Co. — A new home for our heirloom goods, in the making." />
<meta name="twitter:card" content="summary_large_image" />

<link rel="icon" href="assets/quinlynn-q.png" type="image/png" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Manrope:wght@300;400;500;600&display=swap"
/>

<style>
  :root {
    --sage:        #8B9D8B;
    --sage-deep:   #6E826E;
    --cream:       #F2EEE7;          /* page bg — slightly warmer cream */
    --frame:       #FAF8F4;          /* card bg — ivory */
    --charcoal:    #2F2F2F;
    --hairline-soft: rgba(47, 47, 47, 0.07);

    --serif: "Playfair Display", Georgia, serif;
    --sans:  "Manrope", ui-sans-serif, system-ui, sans-serif;

    --ease: cubic-bezier(.22,.61,.36,1);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--charcoal);
    font-family: var(--sans);
    font-weight: 400;
    font-size: 16px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    html { scroll-behavior: auto; }
  }

  /* ── Type ────────────────────────────────────────────── */
  .eyebrow {
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--charcoal);
  }
  .h-display {
    font-family: var(--serif);
    font-weight: 500;
    font-size: clamp(34px, 5.4vw, 64px);
    line-height: 1.08;
    letter-spacing: -0.012em;
    text-wrap: balance;
    margin: 0;
    text-align: center;
  }
  .h-display em { font-style: italic; font-weight: 500; color: var(--sage-deep); }
  .lede {
    font-family: var(--serif);
    font-style: italic;
    font-weight: 400;
    font-size: clamp(17px, 1.55vw, 21px);
    line-height: 1.55;
    color: #4a4a4a;
    text-wrap: pretty;
    margin: 0;
    text-align: center;
  }

  /* ── Page scaffold ───────────────────────────────────── */
  .page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: clamp(20px, 3.5vw, 40px);
    background: var(--cream);
  }
  .stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(24px, 4vw, 56px) 0;
  }

  /* ── The framed card ─────────────────────────────────── */
  .card {
    position: relative;
    width: 100%;
    max-width: 1080px;
    margin: 0 auto;
    padding: clamp(48px, 7vw, 112px) clamp(28px, 6vw, 96px);
    background: var(--frame);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(24px, 2.6vw, 36px);
    box-shadow:
      0 1px 1px rgba(58, 53, 44, 0.02),
      0 2px 4px rgba(58, 53, 44, 0.025),
      0 8px 16px rgba(58, 53, 44, 0.025),
      0 24px 40px rgba(58, 53, 44, 0.03),
      0 48px 80px rgba(58, 53, 44, 0.025);
  }

  /* ── Wordmark ────────────────────────────────────────── */
  .logo {
    width: min(640px, 78vw);
    height: auto;
    display: block;
    margin: clamp(4px, 0.5vw, 8px) 0 clamp(2px, 0.6vw, 8px);
  }

  /* ── Ornament — sage hairline + diamond ──────────────── */
  .ornament {
    display: flex;
    align-items: center;
    gap: 14px;
    color: var(--sage);
    margin-top: clamp(6px, 1vw, 12px);
  }
  .ornament .ln {
    display: block;
    width: 64px;
    height: 1px;
    background: var(--sage);
    opacity: .6;
  }
  .ornament .dot {
    width: 6px;
    height: 6px;
    background: var(--sage);
    transform: rotate(45deg);
  }

  /* ── Headline + sub ──────────────────────────────────── */
  .title { max-width: 880px; }
  .sub   { max-width: 560px; }

  /* ── Buttons ─────────────────────────────────────────── */
  .ctas {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: clamp(10px, 2vw, 20px);
  }
  .btn {
    --bg: var(--sage);
    --fg: #fff;
    --bd: var(--sage);
    appearance: none;
    -webkit-appearance: none;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 16px 32px;
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    text-decoration: none;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--bd);
    border-radius: 0;
    cursor: pointer;
    transition: background .4s var(--ease), color .4s var(--ease),
                border-color .4s var(--ease), letter-spacing .4s var(--ease);
  }
  .btn:hover {
    background: var(--sage-deep);
    border-color: var(--sage-deep);
    letter-spacing: 0.22em;
  }
  .btn svg { transition: transform .4s var(--ease); }
  .btn:hover svg { transform: translateX(4px); }

  .btn-ghost {
    --bg: transparent;
    --fg: var(--charcoal);
    --bd: rgba(47,47,47,0.32);
  }
  .btn-ghost:hover {
    background: var(--charcoal);
    border-color: var(--charcoal);
    color: var(--frame);
  }

  /* ── Page footer (outside the card) ──────────────────── */
  .pagefoot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: clamp(18px, 2.5vw, 28px) clamp(4px, 1vw, 16px) 0;
    font-family: var(--sans);
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(47, 47, 47, 0.5);
  }
  .pagefoot a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid currentColor;
    padding-bottom: 1px;
    transition: color .3s var(--ease), border-color .3s var(--ease);
  }
  .pagefoot a:hover { color: var(--sage-deep); border-color: var(--sage-deep); }
  @media (max-width: 620px) {
    .pagefoot { flex-direction: column; gap: 8px; text-align: center; }
  }

  /* ── Reveal on load ──────────────────────────────────── */
  .reveal { opacity: 0; transform: translateY(14px); transition: opacity 1s var(--ease), transform 1s var(--ease); }
  .reveal.in { opacity: 1; transform: translateY(0); }
  .reveal[data-delay="1"] { transition-delay: .10s; }
  .reveal[data-delay="2"] { transition-delay: .22s; }
  .reveal[data-delay="3"] { transition-delay: .34s; }
  .reveal[data-delay="4"] { transition-delay: .46s; }
  .reveal[data-delay="5"] { transition-delay: .58s; }
</style>
<noscript><style>.reveal { opacity: 1; transform: none; }</style></noscript>
</head>
<body>
  <div class="page">
    <main class="stage">
      <section class="card" aria-label="Quinlynn & Co. — Coming Soon">

        <span class="eyebrow reveal" data-delay="1">McKinney, Texas · Coming Soon</span>

        <img
          class="logo reveal"
          data-delay="2"
          src="assets/quinlynn-logo.png?v=1"
          alt="Quinlynn & Co. — Est. 2023"
        />

        <div class="ornament reveal" data-delay="2" aria-hidden="true">
          <span class="ln"></span><span class="dot"></span><span class="ln"></span>
        </div>

        <h1 class="h-display title reveal" data-delay="3">
          A new home for our<br />
          heirloom goods, <em>in the making</em>.
        </h1>

        <p class="lede sub reveal" data-delay="4">
          The full studio site is on its way. In the meantime,
          recent small-batch drops are listed on Etsy.
        </p>

        <div class="ctas reveal" data-delay="5">
          <a
            class="btn"
            href="https://thewaysofherhome.etsy.com"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Shop Quinlynn & Co. on Etsy (opens in a new tab)"
          >
            Shop on Etsy
            <svg width="14" height="14" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M6 16h20M19 9l7 7-7 7"></path>
            </svg>
          </a>
          <a
            class="btn btn-ghost"
            href="mailto:hello@quinlynnandco.com?subject=Custom%20Order%20%E2%80%94%20Quinlynn%20%26%20Co."
          >
            Custom Orders
          </a>
        </div>

      </section>
    </main>

    <footer class="pagefoot reveal" data-delay="5">
      <span>© 2026 Quinlynn &amp; Co.</span>
      <span>
        <a href="https://thewaysofherhome.etsy.com" target="_blank" rel="noopener noreferrer">Etsy</a>
        &nbsp;·&nbsp;
        <a href="mailto:hello@quinlynnandco.com">Email</a>
      </span>
    </footer>
  </div>

<script>
  // Subtle staggered entrance — runs once on load.
  window.addEventListener("load", () => {
    requestAnimationFrame(() => {
      document.querySelectorAll(".reveal").forEach((el) => el.classList.add("in"));
    });
  });
</script>
</body>
</html>
